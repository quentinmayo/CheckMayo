name: Internal scanner integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
jobs:
  scan:
    if: github.repository == 'securelyprogramming/CheckMayo-internal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan internal source with Gitleaks
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 128 --user 65532:65532 -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /src --redact --no-banner
      - name: Verify source-scanner contract
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          from app.packages import validate_compose
          for path in Path('scanners').glob('*.yaml'):
              validate_compose(path.read_text())
          print('All registry starter packages validated')
          PY
