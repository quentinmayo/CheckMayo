name: checkmayo
services:
  app:
    build: .
    image: checkmayo:local
    ports: ['127.0.0.1:8000:8000']
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      CHECKMAYO_MODE: ${CHECKMAYO_MODE:-controller}
      CHECKMAYO_SIGNUP: ${CHECKMAYO_SIGNUP:-true}
      CHECKMAYO_ADMIN_EMAIL: ${CHECKMAYO_ADMIN_EMAIL:?Set administrator email}
      CHECKMAYO_ADMIN_PASSWORD: ${CHECKMAYO_ADMIN_PASSWORD:?Set administrator password}
      CHECKMAYO_ENCRYPTION_KEY: ${CHECKMAYO_ENCRYPTION_KEY:?Generate an encryption key}
      DATABASE_URL: postgresql+psycopg://checkmayo:${POSTGRES_PASSWORD:?Set database password}@db:5432/checkmayo
      CHECKMAYO_DONATION_URL: ${CHECKMAYO_DONATION_URL:-}
    volumes: ['app-state:/data']
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=256m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: checkmayo
      POSTGRES_USER: checkmayo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkmayo -d checkmayo']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt: ['no-new-privileges:true']
volumes:
  app-state:
  database:
